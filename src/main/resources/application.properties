# Local defaults — Docker Compose overrides these via environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=fooduser
spring.datasource.password=foodpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8080

# HikariCP — placeOrder opens several short-lived connections per request
# (each DAO method uses its own dataSource.getConnection() rather than the
# Spring-managed transaction connection). Default pool size 10 is too small
# for graceful 20+ parallel callers; bump it.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=5000

# Logging
logging.config=classpath:logback-spring.xml
# Suppress full stack traces in error responses (don't leak internals to clients)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
